server:
  port: "8080"
  host: "127.0.0.1"
  mode: release

github:
  token: ""          # or use env/flag
  org: ""
  user: ""

scan:
  concurrency: 8
  report_dir: ./reports

rules:
  cache_ttl_hours: 12
  cache_dir: ""              # empty = ~/.actionscan
  fetch_latest_tags: true
  use_osv: true              # OSV.dev per-action queries
  malicious_feed_url: ""     # extra compromised-action feed; empty = default
