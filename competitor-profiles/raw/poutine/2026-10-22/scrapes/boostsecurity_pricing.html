document.addEventListener("DOMContentLoaded", () => {
  const wrappers = document.querySelectorAll('[glow-border="wrapper"]');
  if (!wrappers.length) return;
  wrappers.forEach(wrapper => {
    wrapper.addEventListener("mousemove", function(e) {
      this.querySelectorAll('[glow-border="card"]').forEach(card => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--cursor-x", (e.clientX - rect.left) + "px");
        card.style.setProperty("--cursor-y", (e.clientY - rect.top) + "px");
      });
    });
  });
});
</script>

<script>
/* ============================================
   HubSpot Forms API Integration - BoostSecurity
   
   Contact Form Fields: firstname, lastname, contact_number, company, email, message
   Request a Demo Fields: firstname, lastname, contact_number, company, email
   Mythos Demo Fields: firstname, lastname, company, email, role
   CISO Guide Fields: firstname, lastname, email + PDF download
   
   All "Request a Demo" forms use the same HubSpot form GUID.
   Fields are detected dynamically — only sends what exists in the form.
   
   Paste in Project Settings → Custom Code → Footer Code
   ============================================ */

(function () {
  // ---- Configuration ----
  var PORTAL_ID = "9281591";

  var FORM_CONFIG = {
    Contact: {
      formGuid: "def13d9b-6fd7-4973-9f52-793a3082a370",
      downloadUrl: null,
    },
    "Request a Demo": {
      formGuid: "54966e88-a2eb-4f01-ab5b-9d4ed7b39511",
      downloadUrl: null,
    },
    "Ciso Guide": {
      formGuid: "dc943695-526d-443b-a77d-288e678cd475",
      downloadUrl:
        "https://cdn.prod.website-files.com/69b5b5312ac408e2f5dca3ba/6a0357de1e1b9757dc9f9f8a_CISO%20%26%20CTO%20Guide%20to%20Supply%20Chain%20Security.pdf",
    },
  };

  // ---- Field mapping: Webflow field name → HubSpot internal name ----
  var FIELD_MAP = {
    firstname: "firstname",
    lastname: "lastname",
    contact_number: "phone",
    company: "company",
    email: "email",
    message: "message",
    role: "role",
  };

  // ---- Helper: Get form element by name ----
  function getFormByName(name) {
    var forms = document.querySelectorAll("form");
    for (var i = 0; i < forms.length; i++) {
      if (forms[i].getAttribute("data-name") === name) {
        return forms[i];
      }
    }
    return null;
  }

  // ---- Helper: Build HubSpot fields array dynamically ----
  function buildFields(form) {
    var fields = [];

    Object.keys(FIELD_MAP).forEach(function (webflowName) {
      var input = form.querySelector('[name="' + webflowName + '"]');
      if (input && input.value) {
        fields.push({
          name: FIELD_MAP[webflowName],
          value: input.value,
        });
      }
    });

    return fields;
  }

  // ---- Helper: Force download PDF ----
  function downloadPdf(url) {
    fetch(url)
      .then(function (response) {
        return response.blob();
      })
      .then(function (blob) {
        var blobUrl = window.URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = blobUrl;
        link.download = "CISO-CTO-Guide-Supply-Chain-Security.pdf";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
      })
      .catch(function (error) {
        // Fallback: open in new tab if download fails
        console.error("Download failed, opening in new tab:", error);
        window.open(url, "_blank");
      });
  }

  // ---- Helper: Submit to HubSpot ----
  function submitToHubSpot(formGuid, fields) {
    var url =
      "https://api.hsforms.com/submissions/v3/integration/submit/" +
      PORTAL_ID +
      "/" +
      formGuid;

    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fields: fields,
        context: {
          pageUri: window.location.href,
          pageName: document.title,
        },
      }),
    }).then(function (response) {
      if (!response.ok) {
        throw new Error("HubSpot submission failed: " + response.status);
      }
      return response.json();
    });
  }

  // ---- Initialize forms ----
  document.addEventListener("DOMContentLoaded", function () {
    Object.keys(FORM_CONFIG).forEach(function (formName) {
      var config = FORM_CONFIG[formName];
      var form = getFormByName(formName);

      if (!form) return;

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        e.stopPropagation();

        var submitBtn = form.querySelector('[type="submit"]');
        var originalText = submitBtn ? submitBtn.value : "Submit";

        // Show loading state
        if (submitBtn) {
          submitBtn.value = "Submitting...";
          submitBtn.disabled = true;
        }

        var fields = buildFields(form);

        submitToHubSpot(config.formGuid, fields)
          .then(function () {
            // Success - show Webflow success message
            var successDiv = form.parentElement.querySelector(".w-form-done");
            var errorDiv = form.parentElement.querySelector(".w-form-fail");
            if (successDiv) successDiv.style.display = "block";
            if (errorDiv) errorDiv.style.display = "none";
            form.style.display = "none";

            // Auto-download PDF if configured
            if (config.downloadUrl) {
              downloadPdf(config.downloadUrl);
            }
          })
          .catch(function (error) {
            console.error("HubSpot Error:", error);
            // Show Webflow error message
            var errorDiv = form.parentElement.querySelector(".w-form-fail");
            if (errorDiv) errorDiv.style.display = "block";
          })
          .finally(function () {
            if (submitBtn) {
              submitBtn.value = originalText;
              submitBtn.disabled = false;
            }
          });
      });
    });
  });
})();
</script></body></html>
